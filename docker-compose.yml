version: '3.8'

services:
  clr-trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clr_bingx_bot
    restart: always
    ports:
      - "80:80"
    environment:
      - BINGX_API_KEY=${BINGX_API_KEY:-demo_api_key}
      - BINGX_SECRET_KEY=${BINGX_SECRET_KEY:-demo_secret_key}
      - BINGX_IS_DEMO=${BINGX_IS_DEMO:-true}
      - WEBHOOK_PASSPHRASE=${WEBHOOK_PASSPHRASE:-clr_bingx_secret_passphrase_2026}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/backend/data
